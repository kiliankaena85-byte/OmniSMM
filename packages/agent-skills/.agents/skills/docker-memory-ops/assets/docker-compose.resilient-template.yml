# docker-compose.resilient-template.yml
# Эталонный шаблон Docker Compose с гарантированной защитой от OOM и кризисов памяти (2026)

version: "3.8"

services:
  # -------------------------------------------------------------
  # PostgreSQL Database Container
  # -------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: production_db
    restart: unless-stopped
    # Защита от OOM при параллельных запросах: расширенный /dev/shm
    shm_size: 256m
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536M      # Жесткий потолок cgroups v2
        reservations:
          memory: 768M       # Мягкая резервация памяти ядра
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # -------------------------------------------------------------
  # Redis 7 In-Memory Cache & Queue Broker
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: production_redis
    restart: unless-stopped
    # maxmemory строго ≤ 65% от лимита контейнера под буфер Copy-on-Write при BGSAVE/AOF!
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 768mb
      --maxmemory-policy volatile-lru
      --activedefrag yes
      --save 300 1
      --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1280M      # Запас 512MB сверх maxmemory под форк COW
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # -------------------------------------------------------------
  # Next.js 16 Web Application Container
  # -------------------------------------------------------------
  app:
    image: smmplan_app:latest
    container_name: production_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # V8 max-old-space-size строго 75% от жесткого лимита памяти!
      - NODE_OPTIONS=--max-old-space-size=768 --diagnostic-report-on-fatalerror --diagnostic-report-path=/tmp/reports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1024M      # Hard Limit (memory.max)
        reservations:
          memory: 768M       # Soft Limit (memory.high / memory.low)
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # -------------------------------------------------------------
  # Background Worker (BullMQ / Async Tasks)
  # -------------------------------------------------------------
  worker:
    image: smmplan_worker:latest
    container_name: production_worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # V8 limit 384MB для контейнера с лимитом 512MB
      - NODE_OPTIONS=--max-old-space-size=384 --diagnostic-report-on-fatalerror
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
